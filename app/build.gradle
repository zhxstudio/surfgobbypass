plugins { id 'com.android.application' }

// zhxstudio — permanent release signing, generated by init-signing.ps1.
def signingFile = rootProject.file('signing/keystore.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'com.zhx.studiotool'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.zhx.studiotool'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.3'
    }
    buildFeatures { aidl true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('signing/surfgobbypass.jks')
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
